{% extends "base.html" %}
{% block contenu %}
<h1>Dossiers de demande</h1>
<form method="get">
  <input name="q" value="{{ q }}" placeholder="Nom ou prénom">
  <select name="statut">
    <option value="">Tous les statuts</option>
    {% for valeur, libelle in statuts %}
    <option value="{{ valeur }}" {% if valeur == statut %}selected{% endif %}>{{ libelle }}</option>
    {% endfor %}
  </select>
  <button>Filtrer</button>
</form>
<table>
  <tr><th>N°</th><th>Candidat</th><th>Filière</th><th>Date</th><th>Statut</th><th></th></tr>
  {% for d in demandes %}
  <tr>
    <td>{{ d.id }}</td><td>{{ d.etudiant }}</td><td>{{ d.filiere }}</td>
    <td>{{ d.date_creation|date:"d/m/Y" }}</td><td>{{ d.get_statut_display }}</td>
    <td><a href="{% url 'detail_demande' d.id %}">Ouvrir</a></td>
  </tr>
  {% empty %}
  <tr><td colspan="6">Aucun dossier.</td></tr>
  {% endfor %}
</table>
{% endblock %}
