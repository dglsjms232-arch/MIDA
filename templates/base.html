<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{% block titre %}MIDA{% endblock %}</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem}
nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ccc;padding-bottom:.5rem;margin-bottom:1rem}
.msg{padding:.5rem;background:#eef;margin:.5rem 0}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #ccc;padding:.4rem;text-align:left}
label{display:block;margin-top:.7rem}
</style>
</head>
<body>
<nav>
  <a href="{% url 'accueil' %}">Accueil</a>
  {% if user.is_authenticated %}
  <span>{{ user.username }}</span>
  <form method="post" action="{% url 'deconnexion' %}" style="margin-left:auto">{% csrf_token %}<button>Déconnexion</button></form>
  {% endif %}
</nav>
{% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
{% block contenu %}{% endblock %}
</body>
</html>
